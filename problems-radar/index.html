        let routeLine;
        const app = document.querySelector(".app");
        function setSidebar(open) {

        function message(status, hint) {
          el("status").textContent = status;
          const isError = /失败|不支持|未成功|无法|需要安全/.test(status);
          el("hint").textContent = isError ? hint : "";
          el("hint").hidden = !isError;
          if (isError) setSidebar(true);
        }
        function locationButtonState() {
          el("start").textContent = watchId !== null ? "停止定位" : "开始定位并跟随";
          el("start").setAttribute("aria-pressed", String(watchId !== null));
        }
        if (window.L) {
          map = L.map("map", { zoomControl: false }).setView([30, 105], 3);
          L.control.zoom({ position: "topright" }).addTo(map);
          L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
          routeLine = L.polyline(roadRoute, {
            color: "#159447",
            weight: 5,
            opacity: 0.95,
            lineCap: "round",
            lineJoin: "round",
          });
          const cumulative = [0];
          for (let i = 1; i < roadRoute.length; i++) {
            cumulative.push(cumulative[i - 1] + L.latLng(roadRoute[i - 1]).distanceTo(L.latLng(roadRoute[i])));
          }
          const mileageTip = L.tooltip({ direction: "top", offset: [0, -10], opacity: 1 });
          let screenRoute = [];
          function refreshScreenRoute() {
            screenRoute = roadRoute.map((point) => map.latLngToContainerPoint(point));
            map.closeTooltip(mileageTip);
          }
          function projectOnSegment(point, a, b) {
            const dx = b.x - a.x,
              dy = b.y - a.y;
            const lengthSquared = dx * dx + dy * dy;
            const t = lengthSquared ? Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared)) : 0;
            const x = a.x + t * dx,
              y = a.y + t * dy;
            return { t, x, y, distance: Math.hypot(point.x - x, point.y - y) };
          }
          function showMileage(event) {
            if (!map.hasLayer(routeLine)) return;
            if (!screenRoute.length) refreshScreenRoute();
            const hits = [];
            let nearest = null;
            for (let i = 1; i < screenRoute.length; i++) {
              const hit = projectOnSegment(event.containerPoint, screenRoute[i - 1], screenRoute[i]);
              hit.meters = cumulative[i - 1] + hit.t * (cumulative[i] - cumulative[i - 1]);
              if (!nearest || hit.distance < nearest.distance) nearest = hit;
              hits.push(hit);
            }
            if (!nearest || nearest.distance > 18) {
              map.closeTooltip(mileageTip);
              return;

            const passages = hits
              .filter((hit) => hit.distance <= Math.min(18, nearest.distance + 2))
              .map((hit) => hit.meters)
              .sort((a, b) => a - b);
            const distinct = passages.filter((meters, i) => i === 0 || meters - passages[i - 1] > 150);
            const text =
              distinct.length > 1
                ? "重合路段 · 距起点 " + distinct.map((meters) => (meters / 1000).toFixed(2)).join(" / ") + " 公里"
                : "距起点 " + (nearest.meters / 1000).toFixed(2) + " 公里";
            mileageTip.setLatLng(map.containerPointToLatLng(L.point(nearest.x, nearest.y))).setContent(text);
            if (!map.hasLayer(mileageTip)) mileageTip.addTo(map);
          }
          map.on("mousemove click", showMileage);
          map.on("zoomend moveend resize", refreshScreenRoute);
          map.on("movestart zoomstart", () => map.closeTooltip(mileageTip));
          map.getContainer().addEventListener("mouseleave", () => map.closeTooltip(mileageTip));

            // Local files have no HTTP Referer; use Esri for the local test instead of OSM's web tile server.
            const tiles = L.tileLayer(

                : "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

                attribution: localFile

                  : '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
              }

              tileErrors++;
              el("mapStatus").textContent = "地图加载失败，请检查网络";
            });
            tiles.on("loading", () => {
              tileErrors = 0;
              el("mapStatus").textContent = "加载地图中";
            });
            tiles.on("load", () => {
              el("mapStatus").textContent = tileErrors ? "部分地图加载失败" : "地图已加载";
            });

        }

          const { latitude, longitude, accuracy } = position.coords;
          const first = !lastPosition;
          lastPosition = [latitude, longitude];
          el("coords").textContent = latitude.toFixed(5) + " / " + longitude.toFixed(5);
          el("accuracy").textContent = "± " + Math.round(accuracy) + " 米";

                color: "#fff",
                weight: 3,
                fillColor: "#246bfe",
                fillOpacity: 1,
                interactive: false,
              }).addTo(map);

            stop();

            message("定位需要安全网址", "请使用 HTTPS 地址打开这个页面。");
            return;
          }
          following = true;
          const session = ++locationSession;
          message("正在获取位置…", "请允许定位；首次定位可能需要几十秒。");
          try {
            watchId = navigator.geolocation.watchPosition(
              (position) => {
                if (session !== locationSession) return;
                display(position);
              },
              (error) => {
                if (session !== locationSession) return;
                const hints = {
                  1: "定位权限被拒绝。请检查 iPhone 定位服务和 Safari 的网站定位权限；本地预览可能无法请求权限，请改用 HTTPS。",
                  2: "暂时无法获取位置。请检查定位服务，尝试移到室外后重试。",
                  3: "定位超时，仍在等待下一次更新。请保持页面在前台，或停止后重试。",
                };
                message("定位未成功", hints[error.code] || error.message);
                if (error.code === 1) stop();
              },
              { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
            );
            locationButtonState();
          } catch (error) {
            stop();
            message("此环境无法启动定位", error.message + "；请尝试用 Safari 打开 HTTPS 页面。");
          }
        };
        el("route").onchange = () => {
          if (!map || !routeLine) return;
          if (!el("route").value) {
            map.removeLayer(routeLine);
            map.closeTooltip();
            return;
          }
          if (!map.hasLayer(routeLine)) routeLine.addTo(map);
          const sidePadding = !app.classList.contains("sidebar-closed") && window.innerWidth > 600 ? 360 : 35;
          map.fitBounds(routeLine.getBounds(), { paddingTopLeft: [sidePadding, 35], paddingBottomRight: [35, 35] });
        };
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && watchId !== null) message("已回到页面，等待位置更新", "显示的坐标是最后一次定位结果，请留意最近更新时间。");
        });
        window.addEventListener("pagehide", stop);
      })();
