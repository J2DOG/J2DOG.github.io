      let radarExportDirectory = null;
      let radarCardsVisible = false;
      const radarIssueMarkers = new Set();
      function radarApplyCards() {
        for (const marker of radarIssueMarkers) {
          const tip = marker.getTooltip();
          if (!tip) continue;
          tip.options.permanent = radarCardsVisible;
          if (radarCardsVisible) marker.openTooltip();
          else marker.closeTooltip();
        }
      }
      function radarRegisterMarker(marker) {
        radarIssueMarkers.add(marker);
        const tip = marker.getTooltip();
        if (tip) tip.options.permanent = radarCardsVisible;
        if (radarCardsVisible) marker.openTooltip();
        return marker;
      }

      function radarHandleStore(mode, value) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("problems-radar-files", 1);
          request.onupgradeneeded = () => request.result.createObjectStore("handles");
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            const db = request.result,
              tx = db.transaction("handles", mode === "get" ? "readonly" : "readwrite"),
              store = tx.objectStore("handles");
            let op;
            if (mode === "get") op = store.get("export");
            else if (value) op = store.put(value, "export");
            else op = store.delete("export");
            let result;
            op.onsuccess = () => {
              result = op.result;
            };
            tx.oncomplete = () => {
              db.close();
              resolve(result);
            };
            tx.onerror = () => {
              db.close();
              reject(tx.error);
            };
          };
        });
      }
      async function radarWriteCSV(directory, name, content) {
        const file = await directory.getFileHandle(name, { create: true });
        const writer = await file.createWritable();
        try {
          await writer.write(content);
          await writer.close();
        } catch (error) {
          try {
            await writer.abort();
          } catch (e) {}
          throw error;
        }
      }
      function radarRead(key, fallback) {
        try {
          return JSON.parse(localStorage.getItem(key)) ?? fallback;
        } catch (e) {
          return fallback;
        }
      }
      function radarSave(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          return false;
        }
      }

      function formatLocalTime(utc, offsetMinutes) {
        const date = new Date(utc);
        if (!utc || !Number.isFinite(date.getTime())) return "时间未知";
        const offset = Number.isFinite(offsetMinutes) ? offsetMinutes : -date.getTimezoneOffset();
        const local = new Date(date.getTime() + offset * 60000),
          pad = (n) => String(n).padStart(2, "0");
        const zone = "UTC" + (offset >= 0 ? "+" : "-") + pad(Math.floor(Math.abs(offset) / 60)) + ":" + pad(Math.abs(offset) % 60);
        return (
          local.getUTCFullYear() +
          "-" +
          pad(local.getUTCMonth() + 1) +
          "-" +
          pad(local.getUTCDate()) +
          " " +
          pad(local.getUTCHours()) +
          ":" +
          pad(local.getUTCMinutes()) +
          ":" +
          pad(local.getUTCSeconds()) +
          " " +
          zone
        );
      }
      function issueTitle(utc, description, offsetMinutes) {
        return formatLocalTime(utc, offsetMinutes) + " / " + (description || "待填写问题");
      }

        return { 高: "severity-high", 中: "severity-medium", 低: "severity-low" }[value] || "severity-unknown";
      }
