<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>狼堡路线 · 重点问题路段</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #203345;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f3f6f8;
      }
      main {
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-columns: 380px 1fr;
      }
      aside {
        padding: 26px 22px;
        overflow: auto;
        background: #fff;
        box-shadow: 2px 0 20px #23334418;
        z-index: 500;
      }
      header small {
        color: #658b87;
        letter-spacing: 2px;
      }
      h1 {
        font-size: 26px;
        margin: 12px 0;
      }
      header p,
      .note {
        font-size: 12px;
        color: #6c7c8b;
        line-height: 1.7;
      }
      .stats {
        display: flex;
        gap: 10px;
        margin: 20px 0;
      }
      .stats div {
        flex: 1;
        padding: 12px;
        background: #f3f6f8;
        border-radius: 12px;
      }
      .stats strong {
        display: block;
        font-size: 24px;
      }
      .stats small {
        font-size: 11px;
        color: #6c7c8b;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid #dce4ea;
        border-radius: 10px;
        background: #fff;
        color: inherit;
        padding: 9px 12px;
      }
      button:hover {
        background: #f2f6fa;
      }
      #list {
        display: grid;
        gap: 12px;
      }
      .card {
        text-align: left;
        border-left: 4px solid var(--color);
        width: 100%;
        padding: 14px;
      }
      .card.active {
        background: #edf4fa;
        outline: 2px solid #9fbacd;
      }
      .card .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .badge {
        background: var(--color);
        color: #fff;
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11px;
      }
      .card p {
        font-size: 13px;
        line-height: 1.7;
        margin: 10px 0 0;
      }
      .num {
        font-size: 11px;
        color: #7a8e9c;
        margin-bottom: 5px;
      }
      .note {
        border-top: 1px solid #e5ecf1;
        margin-top: 20px;
        padding-top: 12px;
      }
      #map {
        height: 100%;
        min-width: 0;
        background: #e8edf2;
      }
      .map-label {
        border: 0;
        border-radius: 5px;
        font-size: 11px;
        box-shadow: 0 1px 7px #0003;
      }
      .legend {
        background: #fff;
        padding: 10px 12px;
        border-radius: 8px;
        box-shadow: 0 2px 9px #0002;
        font-size: 12px;
        line-height: 1.9;
      }
      .legend i {
        display: inline-block;
        width: 22px;
        height: 4px;
        vertical-align: middle;
        margin-right: 7px;
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 52% 48%;
        }
        aside {
          grid-row: 2;
          padding: 16px;
        }
        #map {
          grid-row: 1;
        }
        header p,
        .stats {
          display: none;
        }
        h1 {
          font-size: 21px;
        }
      }
      body.export main {
        display: block;
        width: 1800px;
        height: 1400px;
      }
      body.export aside,
      body.export .leaflet-control-zoom {
        display: none;
      }
      .figure-heading {
        position: absolute;
        left: 28px;
        top: 24px;
        z-index: 700;
        background: #fffef8f5;
        padding: 20px 26px;
        border-radius: 14px;
        box-shadow: 0 3px 18px #20334520;
        pointer-events: none;
      }
      .figure-heading h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .figure-heading p {
        margin: 0;
        font-size: 17px;
        color: #526779;
      }
      .figure-callout {
        position: absolute;
        width: 350px;
        padding: 17px 19px;
        background: #fffffffa;
        border: 1px solid #dce4ea;
        border-top: 3px solid var(--color);
        border-radius: 9px;
        z-index: 650;
        box-shadow: 0 4px 18px #20334516;
        pointer-events: none;
      }
      .figure-callout strong {
        font-size: 25px;
      }
      .figure-callout p {
        font-size: 30px;
        font-weight: 500;
        line-height: 1.5;
        margin: 10px 0 0;
      }
      .figure-callout .badge {
        float: right;
        font-size: 16px;
      }
      body.export .leaflet-tile-pane {
        filter: grayscale(0.88) saturate(0.25) brightness(1.06);
        opacity: 0.7;
      }
      body.export #map {
        background: #f4f6f8;
      }
      .figure-lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 600;
        pointer-events: none;
      }
      #map {
        background: #e5e7eb;
      }
      #map .leaflet-tile-pane {
        filter: grayscale(1);
        opacity: 0.55;
      }
    </style>
  </head>

        issues = [
          [6.35, 6.6, "高度", "匝道汇入、汇出时晃动剧烈，存在接管风险，需重点提升稳定性。"],
          [7.5, 8.7, "中度", "优化高速 S 弯横向体感，避免拖拽感。"],
          [9.5, 10.75, "高度", "临时施工路段存在中心线不稳定、立柱误检为 VRU 及行人、轨迹绕行抖动等问题。"],
          [9.8, 10.5, "高度", "完成新路段地图修正。"],
          [11.43, 11.79, "中度", "优化匝道行驶体感。"],
          [16.1, 16.43, "高度", "优化高架曲率弯晃动问题，增强汇出稳定性。"],
          [0.7, 1.1, "修图", "完成该路段地图修正。"],

        ];
      const range = (x) => x[0].toFixed(2) + "–" + x[1].toFixed(2) + " km";
      const exportMode = new URLSearchParams(location.search).has("export");
      if (exportMode) document.body.classList.add("export");
      if (!window.L) {
        document.getElementById("map").textContent = "地图加载失败，请检查网络后刷新。";
      } else {
        const map = L.map("map", { zoomControl: false });
        L.control.zoom({ position: "topright" }).addTo(map);
        L.control.scale({ imperial: false }).addTo(map);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        const distances = [0];
        for (let i = 1; i < roadRoute.length; i++) distances.push(distances[i - 1] + L.latLng(roadRoute[i - 1]).distanceTo(L.latLng(roadRoute[i])));
        document.getElementById("total").textContent = (distances.at(-1) / 1000).toFixed(2);
        function pointAt(km) {
          const m = km * 1000;
          for (let i = 1; i < distances.length; i++)
            if (distances[i] >= m) {
              const t = (m - distances[i - 1]) / (distances[i] - distances[i - 1]);
              return roadRoute[i - 1].map((v, j) => v + t * (roadRoute[i][j] - v));
            }
          return roadRoute.at(-1);
        }
        function segment(a, b) {
          return [pointAt(a), ...roadRoute.filter((p, i) => distances[i] > a * 1000 && distances[i] < b * 1000), pointAt(b)];
        }
        const routeLine = L.polyline(roadRoute, { color: "#41464d", weight: 5, opacity: 0.95 }).addTo(map),
          group = L.featureGroup().addTo(map),
          cards = [],
          lines = [];
        function focus(i) {
          cards.forEach((c, j) => c.classList.toggle("active", i === j));
          map.fitBounds(lines[i].getBounds(), { padding: [55, 55], maxZoom: 17 });
          lines[i].openPopup();
          cards[i].scrollIntoView({ block: "nearest" });
        }
        issues.forEach((issue, i) => {
          const color = i === 1 || i === 3 || i >= 6 ? "#18875b" : issue[2] === "高度" ? "#d74343" : "#e49824";
          const line = L.polyline(segment(issue[0], issue[1]), {
            color,
            weight: i === 3 || i >= 6 ? 5 : 9,
            opacity: 0.95,
            dashArray: i === 3 || i >= 6 ? "7 7" : null,
          }).addTo(group);
          lines.push(line);
          const popup = document.createElement("div");
          const title = document.createElement("strong");
          title.textContent = i + 1 + ". " + range(issue) + " · " + issue[2];
          const desc = document.createElement("p");
          desc.textContent = issue[3];
          popup.append(title, desc);
          line.bindPopup(popup).on("click", () => focus(i));
          const label = document.createElement("span");
          label.textContent = i + 1 + " · " + range(issue);
          L.circleMarker(pointAt((issue[0] + issue[1]) / 2), { radius: 4, color: "#fff", weight: 1, fillColor: color, fillOpacity: 1 })
            .addTo(group)
            .bindTooltip(label, {
              permanent: !exportMode,
              direction: i === 3 ? "bottom" : "top",
              offset: [0, i === 3 ? 8 : -8],
              className: "map-label",
            })
            .on("click", () => focus(i));
          for (const km of [issue[0], issue[1]])
            L.circleMarker(pointAt(km), { radius: 3, color, weight: 2, fillColor: "#fff", fillOpacity: 1 })
              .addTo(group)
              .bindTooltip(km.toFixed(2) + " km");
          const card = document.createElement("button");
          card.className = "card";
          card.style.setProperty("--color", color);
          card.innerHTML =
            '<div class="num">重点路段 0' +
            (i + 1) +
            '</div><div class="top"><strong>' +
            range(issue) +
            '</strong><span class="badge">' +
            issue[2] +
            "</span></div>";
          const p = document.createElement("p");
          p.textContent = issue[3];
          card.append(p);
          card.onclick = () => focus(i);
          cards.push(card);
          document.getElementById("list").append(card);
        });
        L.marker(roadRoute[0]).addTo(map).bindPopup("狼堡环线起点 / 终点 · 0 km");
        const legend = L.control({ position: "bottomright" });
        legend.onAdd = () => {
          const div = L.DomUtil.create("div", "legend");
          div.innerHTML =
            '<i style="background:#41464d"></i>狼堡路线<br><i style="background:#d74343"></i>高度<br><i style="background:#e49824"></i>中度<br><i style="background:#18875b"></i>已解决（修图保留虚线）';

        };

        document.getElementById("overview").onclick = () => {
          cards.forEach((c) => c.classList.remove("active"));
          map.closePopup();
          map.fitBounds(routeLine.getBounds(), exportMode ? { paddingTopLeft: [410, 180], paddingBottomRight: [410, 120] } : { padding: [35, 35] });

        document.getElementById("allIssues").onclick = () => map.fitBounds(group.getBounds(), { padding: [45, 45] });
        if (exportMode) {
          const heading = document.createElement("div");
          heading.className = "figure-heading";
          heading.innerHTML = "<h1>狼堡路线 · 重点优化路段</h1><p>WOLFSBURG ROUTE REVIEW　/　6 张问题卡片　·　地图修正涵盖 3 个路段</p>";
          document.getElementById("map").append(heading);
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.classList.add("figure-lines");
          document.getElementById("map").append(svg);
          const placements = [
            [-390, -80],
            [45, -60],
            [-410, -195],
            [330, -160],
            [-390, 20],
            [50, 70],
            [65, -170],
            [-400, -95],
          ];
          const annotations = issues.slice(0, 6).map((issue, i) => {
            const color = i === 1 || i === 3 || i >= 6 ? "#18875b" : issue[2] === "高度" ? "#d74343" : "#e49824";
            const card = document.createElement("div");
            card.className = "figure-callout";
            if (i === 1 || i === 3) {
              card.style.background = "#eef9f2";
              card.style.borderColor = "#c9e6d5";
            }
            card.style.setProperty("--color", color);

            const title = document.createElement("strong");
            title.textContent = i === 3 ? "4 · 地图修正" : i + 1 + " · " + range(issue);
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = i === 1 || i === 3 ? "已解决" : issue[2];
            const description = document.createElement("p");
            description.textContent = i === 3 ? "完成标注路段的地图修正。" : issue[3];
            description.style.whiteSpace = "pre-line";
            card.append(badge, title, description);
            if (i === 1 || i === 3) {
              const resolution = document.createElement("p");
              resolution.textContent = i === 1 ? "已由 control 解决" : "已由 local_map / map_engine 解决";
              resolution.style.cssText = "font-size:18px;line-height:1.5;color:#18875b;margin-top:10px;font-weight:600";
              card.append(resolution);
            }
            document.getElementById("map").append(card);
            const leader = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            leader.setAttribute("fill", "none");
            leader.setAttribute("stroke", color);
            leader.setAttribute("stroke-width", "1.7");
            svg.append(leader);
            const number = L.marker(pointAt((issue[0] + issue[1]) / 2), {
              icon: L.divIcon({
                className: "",
                html:
                  '<div style="background:' +
                  color +
                  ';position:relative;color:#20354b;border:1px solid white;border-radius:50%;width:12px;height:12px;text-align:center;line-height:12px;font-weight:800;font-size:26px"><span style="position:absolute;left:15px;top:-17px;text-shadow:0 1px 3px white,0 -1px 3px white">' +
                  (i + 1) +
                  "</span></div>",
                iconSize: [12, 12],
                iconAnchor: i === 2 ? [6, 20] : i === 3 ? [-8, 6] : [6, 6],
              }),
            }).addTo(map);
            const targets = i === 3 ? [issue, issues[6], issues[7]] : [issue];
            const leaders = targets.map((target, j) => {
              if (j === 0) return leader;
              const extra = leader.cloneNode();
              svg.append(extra);
              return extra;
            });
            return { card, leader, leaders, targets, issue, offset: placements[i] };
          });
          function updateAnnotations() {
            for (const item of annotations) {
              const point = map.latLngToContainerPoint(pointAt((item.issue[0] + item.issue[1]) / 2));
              const left = Math.max(24, Math.min(1426, point.x + item.offset[0]));
              const top = Math.max(180, Math.min(1370 - item.card.offsetHeight, point.y + item.offset[1]));
              item.card.style.left = left + "px";
              item.card.style.top = top + "px";
              item.targets.forEach((target, j) => {
                const destination = map.latLngToContainerPoint(pointAt((target[0] + target[1]) / 2));
                const x = Math.max(left, Math.min(left + item.card.offsetWidth, destination.x));
                const y = Math.max(top + 12, Math.min(top + item.card.offsetHeight - 12, destination.y));
                item.leaders[j].setAttribute("points", x + "," + y + " " + destination.x + "," + destination.y);
              });
            }
          }
          map.on("moveend zoomend resize", updateAnnotations);
          requestAnimationFrame(updateAnnotations);
        }
        document.getElementById("overview").click();
      }
